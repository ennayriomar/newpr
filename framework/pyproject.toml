[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-iad-research"
version = "0.6.0"
description = "Reproducible support-diagnostic industrial anomaly localization research"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["."]
include = ["safe_iad*"]
